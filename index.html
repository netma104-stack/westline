<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>西線外勤日誌與印章套印</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-24">

  <div class="max-w-md mx-auto p-4 space-y-4">
    <!-- 車輛與人員 Header -->
    <header class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold text-slate-900">西線外勤打卡系統</h1>
        <p class="text-[11px] text-slate-500 font-mono mt-0.5">元鴻 | KPB-3955 | 廖曉維</p>
      </div>
      <div class="flex gap-1.5">
        <button onclick="openStampModal()" class="text-xs px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-lg border border-rose-200">
          🔖 印章管理
        </button>
        <button onclick="document.getElementById('pdfFileInput').click()" class="text-xs px-2 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg border border-slate-300">
          📄 PDF
        </button>
      </div>
      <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden">
    </header>

    <!-- 當前設定面板 -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 space-y-2.5 text-xs">
      <div class="flex items-center justify-between">
        <span class="font-bold text-slate-700">登記日期：</span>
        <input type="date" id="inputDate" class="p-1 border border-slate-300 rounded font-semibold text-slate-700">
      </div>
      <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
        <div>
          <label class="block font-semibold text-slate-600 mb-0.5">當前值班人員：</label>
          <select id="staffSelect" class="w-full p-1.5 border border-slate-300 rounded bg-white text-xs font-medium">
  <optgroup label="仁愛">
    <option value="仁愛-檢驗師A">檢驗師A</option>
    <option value="仁愛-檢驗師B">檢驗師B</option>
  </optgroup>
  <optgroup label="和平">
    <option value="和平-檢驗師C">檢驗師C</option>
  </optgroup>
  <optgroup label="中興">
    <option value="中興-檢驗師D">檢驗師D</option>
  </optgroup>
  <optgroup label="昆明">
    <option value="昆明-檢驗師E">檢驗師E</option>
  </optgroup>
  <optgroup label="婦幼">
    <option value="婦幼-檢驗師F">檢驗師F</option>
  </optgroup>
</select>
        </div>
        <div>
          <label class="block font-semibold text-slate-600 mb-0.5">檢體狀態：</label>
          <div class="flex gap-1">
            <button type="button" id="btnSpecimenYes" onclick="toggleSpecimen(true)" class="flex-1 py-1 bg-emerald-600 text-white rounded font-bold">有</button>
            <button type="button" id="btnSpecimenNo" onclick="toggleSpecimen(false)" class="flex-1 py-1 bg-slate-200 text-slate-700 rounded font-bold">無</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 依照上班到下班順序排列的按鈕 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <!-- 上半天 -->
      <div>
        <div class="flex items-center gap-1.5 text-xs font-bold text-blue-800 mb-2">
          <span>🌅</span> 上午第一趟巡迴
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="handleLegClick(1, '中興')" class="p-2.5 bg-blue-50 active:bg-blue-200 border border-blue-200 text-blue-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>1. 中興</span> <span class="text-[10px] text-blue-500 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(2, '昆明')" class="p-2.5 bg-blue-50 active:bg-blue-200 border border-blue-200 text-blue-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>2. 昆明</span> <span class="text-[10px] text-blue-500 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(3, '和平')" class="p-2.5 bg-blue-50 active:bg-blue-200 border border-blue-200 text-blue-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>3. 和平</span> <span class="text-[10px] text-blue-500 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(4, '婦幼')" class="p-2.5 bg-blue-50 active:bg-blue-200 border border-blue-200 text-blue-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>4. 婦幼</span> <span class="text-[10px] text-blue-500 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(5, '仁愛')" class="col-span-2 p-2.5 bg-indigo-50 active:bg-indigo-200 border border-indigo-200 text-indigo-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>5. 仁愛 (第一輪送達)</span> <span class="text-[10px] text-indigo-500 font-normal">報班+用印</span>
          </button>
        </div>
      </div>

      <!-- 午休 -->
      <div class="flex items-center gap-2 py-0.5">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="text-[11px] font-bold text-amber-600 bg-amber-50 px-3 py-0.5 rounded-full border border-amber-200">🍱 午休時間</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- 下半天 -->
      <div>
        <div class="flex items-center gap-1.5 text-xs font-bold text-emerald-800 mb-2">
          <span>🌇</span> 下午第二趟巡迴
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="handleLegClick(6, '昆明')" class="p-2.5 bg-emerald-50 active:bg-emerald-200 border border-emerald-200 text-emerald-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>6. 昆明</span> <span class="text-[10px] text-emerald-600 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(7, '中興')" class="p-2.5 bg-emerald-50 active:bg-emerald-200 border border-emerald-200 text-emerald-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>7. 中興</span> <span class="text-[10px] text-emerald-600 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(8, '和平')" class="p-2.5 bg-emerald-50 active:bg-emerald-200 border border-emerald-200 text-emerald-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>8. 和平</span> <span class="text-[10px] text-emerald-600 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(9, '婦幼')" class="p-2.5 bg-emerald-50 active:bg-emerald-200 border border-emerald-200 text-emerald-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>9. 婦幼</span> <span class="text-[10px] text-emerald-600 font-normal">報班+記</span>
          </button>
          <button onclick="handleLegClick(10, '仁愛')" class="col-span-2 p-2.5 bg-indigo-50 active:bg-indigo-200 border border-indigo-200 text-indigo-900 rounded-xl text-left font-bold text-xs flex justify-between items-center">
            <span>10. 仁愛 (第二輪終點送達)</span> <span class="text-[10px] text-indigo-500 font-normal">報班+用印</span>
          </button>
        </div>
      </div>

      <!-- 下班清潔 -->
      <div class="pt-2 border-t border-slate-100">
        <button onclick="handleClockOut()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-bold rounded-xl text-xs shadow flex items-center justify-center gap-1.5 transition">
          <span>🏁</span> 下班啦！(登記今日裝備擦拭清潔時間)
        </button>
      </div>
    </section>

    <!-- 輸出區 -->
    <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-bold text-slate-700">當前紀錄 (<span id="countText">0</span> 筆)</h2>
        <button onclick="exportOfficialPDF()" class="px-3.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg shadow transition">
          📥 月底一鍵匯出用印 PDF
        </button>
      </div>
      <div id="todayList" class="space-y-1.5 max-h-40 overflow-y-auto text-xs text-slate-600"></div>
    </section>
  </div>

  <!-- 印章管理彈窗 (新增/減少) -->
  <div id="stampModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-sm text-slate-900">印章管理倉庫</h3>
        <button onclick="closeStampModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">✕</button>
      </div>

      <!-- 新增印章區域 -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <span class="block text-xs font-bold text-slate-700">＋ 新增醫檢師印章</span>
        <input type="text" id="newStaffName" placeholder="輸入姓名 (例: 林檢驗師)" class="w-full p-2 border border-slate-300 rounded text-xs">
        <input type="file" id="newStaffImg" accept="image/png,image/jpeg" class="block w-full text-[11px] text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-blue-100 file:text-blue-700">
        <button onclick="addNewStamp()" class="w-full py-1.5 bg-blue-600 text-white rounded text-xs font-bold hover:bg-blue-700">儲存新印章</button>
      </div>

      <!-- 現有印章列表 -->
      <div>
        <span class="block text-xs font-bold text-slate-600 mb-1.5">現存印章列表（點擊 🗑️ 可移除）：</span>
        <div id="stampsList" class="space-y-1.5 max-h-36 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <script>
    // 你的專屬實體透明印章 (廖曉維) - 內建向量式高解析提取
    const DRIVER_STAMP_BASE64 = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFAAAAAcCAYAAAAbJb0RAAAACXBIWXMAAAsTAAALEwEAmpwYAAAFm0lEQVRYhe2YW2wcVxnHf+fM7Hp31/GuvfG1Eyd2YrtJHOcSp6E5pLSlVAq00EsqVSUeQOIBEioeKCEeKCEeKh544AkBL1AVFa1QFUQt1EqFNA0haVukTeI4dZzETuy1vdt7szO38/Awa2dtGseOU4cq/i/tzJnzfWf+5/s/3/lG0TTN+H+q8r8e4L/h/wTwfyEQgAgEIAIBCIAIBCACAYhAACI4eAEX3u3sV3z7hT2a/9K9hVv/vP/Ztw+f8z0wQ0jXb37fF66/5m05+WvBwT+gA3/sY37h8d/5r9z0yV2/f0fH//Wc/wH5tXW3oBwZfgAAAABJRU5ErkJggg==";

    let hasSpecimenState = true;
    let cachedPdfBuffer = null;

    // 初始化日期
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('inputDate').value = today;

    // 印章資料庫 (LocalStorage)
    const defaultStamps = [
  { id: '1', branch: '仁愛', name: '仁愛-檢驗師A', dataUrl: null },
  { id: '2', branch: '仁愛', name: '仁愛-檢驗師B', dataUrl: null },
  { id: '3', branch: '和平', name: '和平-檢驗師C', dataUrl: null },
  { id: '4', branch: '中興', name: '中興-檢驗師D', dataUrl: null },
  { id: '5', branch: '昆明', name: '昆明-檢驗師E', dataUrl: null },
  { id: '6', branch: '婦幼', name: '婦幼-檢驗師F', dataUrl: null }
];
return JSON.parse(localStorage.getItem('my_stamps_warehouse_v2')) || defaultStamps;
}

function saveStoredStamps(stamps) {
localStorage.setItem('my_stamps_warehouse_v2', JSON.stringify(stamps));
updateStaffDropdown();
renderStampsList();
}

function updateStaffDropdown() {
const stamps = getStoredStamps();
const select = document.getElementById('staffSelect');
select.innerHTML = '';

const branches = ['仁愛', '和平', '中興', '昆明', '婦幼'];
branches.forEach(b => {
  const group = document.createElement('optgroup');
  group.label = b;
  stamps.filter(s => s.branch === b).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.innerText = s.name.replace(`${b}-`, '');
    group.appendChild(opt);
  });
  if (group.children.length > 0) {
    select.appendChild(group);
  }
});
}

    // 印章彈窗操作
    function openStampModal() {
      document.getElementById('stampModal').classList.remove('hidden');
      renderStampsList();
    }

    function closeStampModal() {
      document.getElementById('stampModal').classList.add('hidden');
    }

    function renderStampsList() {
      const stamps = getStoredStamps();
      const list = document.getElementById('stampsList');
      list.innerHTML = '';
      stamps.forEach(s => {
        const item = document.createElement('div');
        item.className = 'p-2 bg-slate-50 border border-slate-200 rounded flex justify-between items-center text-xs';
        item.innerHTML = `
          <div class="flex items-center gap-2">
            ${s.dataUrl ? `<img src="${s.dataUrl}" class="w-10 h-5 object-contain bg-white border border-slate-200 rounded">` : '<span class="text-[10px] text-slate-400 border px-1 rounded">無圖檔</span>'}
            <span class="font-bold text-slate-800">${s.name}</span>
          </div>
          <button onclick="removeStamp('${s.id}')" class="text-rose-500 font-bold hover:text-rose-700">🗑️</button>
        `;
        list.appendChild(item);
      });
    }

    function addNewStamp() {
      const name = document.getElementById('newStaffName').value.trim();
      const fileInput = document.getElementById('newStaffImg');
      if (!name) return alert('請輸入醫檢師姓名！');

      const stamps = getStoredStamps();
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          stamps.push({ id: Date.now().toString(), name: name, dataUrl: e.target.result });
          saveStoredStamps(stamps);
          document.getElementById('newStaffName').value = '';
          fileInput.value = '';
          alert(`已成功新增印章：${name}`);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        stamps.push({ id: Date.now().toString(), name: name, dataUrl: null });
        saveStoredStamps(stamps);
        document.getElementById('newStaffName').value = '';
        alert(`已成功新增名單：${name}`);
      }
    }

    window.removeStamp = function(id) {
      let stamps = getStoredStamps();
      if (stamps.length <= 1) return alert('請至少保留一位值班人員！');
      stamps = stamps.filter(s => s.id !== id);
      saveStoredStamps(stamps);
    };

    function toggleSpecimen(val) {
      hasSpecimenState = val;
      const bY = document.getElementById('btnSpecimenYes');
      const bN = document.getElementById('btnSpecimenNo');
      if (val) {
        bY.className = 'flex-1 py-1 bg-emerald-600 text-white rounded font-bold';
        bN.className = 'flex-1 py-1 bg-slate-200 text-slate-700 rounded font-bold';
      } else {
        bN.className = 'flex-1 py-1 bg-rose-600 text-white rounded font-bold';
        bY.className = 'flex-1 py-1 bg-slate-200 text-slate-700 rounded font-bold';
      }
    }

    // 點擊站點
    function handleLegClick(legIndex, stationName) {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const dateStr = document.getElementById('inputDate').value;
      const staffId = document.getElementById('staffSelect').value;
      const stamps = getStoredStamps();
      const staffObj = stamps.find(s => s.id === staffId);

      const records = JSON.parse(localStorage.getItem('my_west_line_records') || '[]');
      records.push({
        id: Date.now(),
        date: dateStr,
        leg: legIndex,
        station: stationName,
        time: timeStr,
        hasSpecimen: hasSpecimenState,
        staffName: staffObj ? staffObj.name : '值班人員',
        staffStampData: staffObj ? staffObj.dataUrl : null
      });
      localStorage.setItem('my_west_line_records', JSON.stringify(records));
      renderList();

      const lineMsg = `西線到${stationName}`;
      window.location.href = `line://msg/text/?${encodeURIComponent(lineMsg)}`;
    }

    // 下班啦
    function handleClockOut() {
      const now = new Date();
      const cleanTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const dateStr = document.getElementById('inputDate').value;

      let cleanLogs = JSON.parse(localStorage.getItem('clean_records') || '{}');
      cleanLogs[dateStr] = { time: cleanTime, done: true };
      localStorage.setItem('clean_records', JSON.stringify(cleanLogs));

      alert(`已登記今日（${dateStr}）清潔消毒時間：${cleanTime}`);
    }

    function renderList() {
      const records = JSON.parse(localStorage.getItem('my_west_line_records') || '[]');
      const container = document.getElementById('todayList');
      document.getElementById('countText').innerText = records.length;
      container.innerHTML = '';

      if (records.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-400 py-3">尚無紀錄</div>';
        return;
      }

      records.forEach((r, idx) => {
        const item = document.createElement('div');
        item.className = 'p-2 bg-slate-50 border border-slate-200 rounded-lg flex justify-between items-center';
        item.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${r.leg}. ${r.station}</span>
            <span class="text-blue-600 font-mono font-bold ml-1">${r.time}</span>
            <span class="text-[10px] ml-1 px-1 rounded ${r.hasSpecimen ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${r.hasSpecimen ? '有檢體' : '無'}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-[10px] text-slate-500">${r.staffName}</span>
            <button onclick="deleteRecord(${idx})" class="text-rose-500 font-bold px-1">✕</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    window.deleteRecord = function(idx) {
      const records = JSON.parse(localStorage.getItem('my_west_line_records') || '[]');
      records.splice(idx, 1);
      localStorage.setItem('my_west_line_records', JSON.stringify(records));
      renderList();
    };

    document.getElementById('pdfFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        cachedPdfBuffer = await file.arrayBuffer();
        alert('官方空白 PDF 載入成功！');
      }
    });

    // 核心匯出 PDF
    async function exportOfficialPDF() {
      if (!cachedPdfBuffer) {
        return alert('請先點擊上方「📄 PDF」按鈕載入空白 PDF！');
      }

      const records = JSON.parse(localStorage.getItem('my_west_line_records') || '[]');
      const { PDFDocument, rgb } = PDFLib;
      const pdfDoc = await PDFDocument.load(cachedPdfBuffer);
      const pages = pdfDoc.getPages();
      const page1 = pages[0];

      // 載入司機專屬印章 (廖曉維)
      let embeddedDriverStamp = null;
      try {
        const driverBytes = Uint8Array.from(atob(DRIVER_STAMP_BASE64.split(',')[1]), c => c.charCodeAt(0));
        embeddedDriverStamp = await pdfDoc.embedPng(driverBytes);
      } catch (err) {}

      const legYMap = {
        1: 676, 2: 636, 3: 596, 4: 556, 5: 516,
        6: 476, 7: 436, 8: 396, 9: 356, 10: 316
      };

      for (const r of records) {
        const yPos = legYMap[r.leg];
        if (yPos) {
          // 1. 到達時間
          page1.drawText(r.time, { x: 92, y: yPos, size: 9, color: rgb(0, 0, 0) });

          // 2. 貼紙完整勾選「是」
          page1.drawText('V', { x: 135, y: yPos + 6, size: 9, color: rgb(0, 0.2, 0.8) });

          // 3. 有檢體打勾
          if (r.hasSpecimen) {
            page1.drawText('V', { x: 165, y: yPos + 2, size: 9, color: rgb(0, 0.2, 0.8) });
          }

          // 4. 蓋醫檢師印章 (若有圖檔用圖檔，若無用仿真方框)
          if (r.staffStampData) {
            try {
              const staffBytes = Uint8Array.from(atob(r.staffStampData.split(',')[1]), c => c.charCodeAt(0));
              const staffImg = await pdfDoc.embedPng(staffBytes);
              page1.drawImage(staffImg, { x: 290, y: yPos - 5, width: 38, height: 18 });
            } catch (e) {}
          } else {
            page1.drawRectangle({
              x: 290, y: yPos - 3, width: 42, height: 16,
              borderColor: rgb(0.85, 0.1, 0.1), borderWidth: 1
            });
            page1.drawText(r.staffName, { x: 293, y: yPos + 1, size: 8, color: rgb(0.85, 0.1, 0.1) });
          }

          // 5. 蓋駕駛印章 (廖曉維專屬實體章)
          if (embeddedDriverStamp) {
            page1.drawImage(embeddedDriverStamp, { x: 340, y: yPos - 5, width: 38, height: 18 });
          }
        }
      }

      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `西線日報表_${today.substring(0, 7)}.pdf`;
      link.click();
    }

    updateStaffDropdown();
    renderList();
  </script>
</body>
