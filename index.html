<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>西線外勤打卡系統</title>
  
  <!-- iOS Web App 設定與圖示 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="西線打卡">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:truck.svg?color=%232563eb">
  
  <!-- Tailwind CSS & pdf-lib CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 select-none">
  <div class="max-w-md mx-auto space-y-3 pb-12">
    
    <!-- 頂部標題與工具按鈕 -->
    <header class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold text-slate-900">西線外勤打卡系統</h1>
        <p class="text-[11px] text-slate-500 font-mono mt-0.5">元鴻 ｜ KPB-3955 ｜ 廖曉維</p>
      </div>
      <div class="flex gap-1.5">
        <button type="button" onclick="openStampModal()" class="text-xs px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold rounded-lg border border-rose-200 transition">
          🔖 印章管理
        </button>
        <button type="button" onclick="document.getElementById('pdfFileInput').click()" class="text-xs px-2 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg border border-slate-300">
          📄 PDF
        </button>
      </div>
      <input type="file" id="pdfFileInput" accept="application/pdf" class="hidden">
    </header>

    <!-- 當前設定面板 (日期、值班人員、檢體狀態) -->
    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 space-y-2.5 text-xs">
      <div class="flex items-center justify-between">
        <span class="font-bold text-slate-700">登記日期：</span>
        <input type="date" id="inputDate" class="p-1 border border-slate-300 rounded font-semibold text-slate-700">
      </div>
      
      <div class="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100">
        <div>
          <label class="block font-semibold text-slate-600 mb-0.5">當前值班人員：</label>
          <select id="staffSelect" class="w-full p-1.5 border border-slate-300 rounded bg-white text-xs font-medium">
            <!-- 由 JavaScript 自動依院區填入 -->
          </select>
        </div>
        <div>
          <label class="block font-semibold text-slate-60
